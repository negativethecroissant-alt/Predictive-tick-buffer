name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Android64
            os: ubuntu-latest
            target: Android64
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: iOS
            os: macos-latest
            target: iOS
          - name: Windows
            os: ubuntu-latest
            target: Win64
          - name: macOS
            os: macos-latest
            target: MacOS
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build Geode Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Combine into .geode Package
    runs-on: ubuntu-latest
    needs: ['build']
    steps:
      - name: Combine Platform Binaries
        uses: geode-sdk/build-geode-mod/combine@main
        id: combine

      - name: Upload Combined .geode Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TickBuffer-Geode-Mod
          path: ${{ steps.combine.outputs.build-output }}
